<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26292d"/>
      <stop offset="1" stop-color="#15181a"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="103.5" fill="none" stroke="#3d4348" stroke-width="3"/>

  <!-- a shell prompt: the application is about agent terminals first of all -->
  <path d="M150 196l58 60-58 60" fill="none" stroke="#79b8ff" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M244 316h120" fill="none" stroke="#d3d6d9" stroke-width="26" stroke-linecap="round"/>

  <!-- three branches off one trunk: parallel sessions in worktrees of their own -->
  <g fill="none" stroke="#7ee787" stroke-width="18" stroke-linecap="round">
    <path d="M330 150v40c0 18 14 32 32 32h0"/>
    <path d="M330 150v0"/>
  </g>
  <circle cx="330" cy="140" r="20" fill="#7ee787"/>
  <circle cx="386" cy="222" r="16" fill="#7ee787"/>
</svg>
